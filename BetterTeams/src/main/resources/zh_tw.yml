help:
  description: 查看你的公會簡介
  ban: 禁止踢出公會的團員（團員只能禁止用戶）
  home: 傳送到公會的位置
  help: 提供個性化的幫助頁面，該頁面僅給有訪問權用戶使用的指令
  promote: 將玩家提升到下一個等級 (有3個階級 擁有者/管理員/成員)
  demote: 將一名玩家降級
  unban: 允許指定的玩家重新加入該公會
  kick: 踢出公會中的指定團員（團員只能踢出比自己低的成員等級）
  leave: 離開當前公會
  chat: 如果含訊息，將向公會聊天室發送一條消息，如果不包括訊息，則玩家訊息將被移至公會聊天室（所有其他訊息都將移至公會聊天室）
  name: 更改公會名稱
  sethome: 設置公會home點的位置（通過/ team home傳送）
  create: 創建一個你所命名的新公會
  invite: 邀請指定的玩家加入公會
  disband: 強制公會中的所有成員離開並解散（無法撤消）
  open: 邀請制及開放制的切換
  info: 提供有關“公會或指定成員”所在的公會的資訊
  color: 改公會名的顏色
  deposit: 將資金存入公會的經費
  bal: 查看公會的經費
  withdraw: 從公會現有的經費中提款 (團員只能提出你曾經存過的錢 但會長能動用公會所有的錢)
  title: 在公會中更改該團員的頭銜
  top: 查看頂尖公會
  rank: 查看公會排名
  join: 加入指定的公會
  delhome: 刪除公會home點
  ally: 請求/接受與另一個公會的聯盟
  neutral: 刪除與另一個公會的聯盟
  allychat: 發送一條消息，只有公會盟友可以看到
  echest: 打開您公會的中界箱
  setwarp: 為您的公會設定一個新的傳點
  warps: 傳送到您的公會設置的傳點
  rankup: 晉升到下一個等級
  tag: 更改公會標籤 (會顯示在頭上)
  delwarp: 從您的公會中刪除一個傳點，會長不需要密碼
